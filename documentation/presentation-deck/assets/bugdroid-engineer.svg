<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%" fill="none">
  <!-- Engineer Bugdroid - 3 Camadas de Arquitetura -->
  <ellipse cx="120" cy="230" rx="70" ry="8" fill="#121316" fill-opacity="0.3"/>

  <!-- Pernas -->
  <rect x="80" y="175" width="18" height="42" rx="9" fill="#3DDC84"/>
  <rect x="122" y="175" width="18" height="42" rx="9" fill="#3DDC84"/>

  <!-- Corpo -->
  <path d="M65 110 H155 V170 C155 180 147 188 137 188 H83 C73 188 65 180 65 170 Z" fill="#3DDC84"/>

  <!-- Braço Esquerdo (Descansando na cintura) -->
  <rect x="42" y="116" width="16" height="50" rx="8" fill="#3DDC84" transform="rotate(18 42 116)"/>

  <!-- Braço Direito (Empunhando Chave Inglesa) -->
  <g transform="translate(145, 95) rotate(-25)">
    <rect x="0" y="10" width="16" height="52" rx="8" fill="#3DDC84"/>
    <!-- Chave Inglesa de Engenharia -->
    <g transform="translate(4, -18)">
      <rect x="0" y="8" width="8" height="28" rx="2" fill="#E2E6EA"/>
      <path d="M-4 2 C -4 -6 12 -6 12 2 C 12 6 8 8 4 9 C 0 8 -4 6 -4 2 Z" fill="#E2E6EA"/>
      <rect x="2" y="-3" width="4" height="6" fill="#1A1C1E"/>
    </g>
  </g>

  <!-- Cabeça com Capacete de Engenharia -->
  <path d="M65 96 C65 68 85 46 110 46 C135 46 155 68 155 96 Z" fill="#3DDC84"/>
  <line x1="87" y1="52" x2="73" y2="28" stroke="#3DDC84" stroke-width="5" stroke-linecap="round"/>
  <line x1="133" y1="52" x2="147" y2="28" stroke="#3DDC84" stroke-width="5" stroke-linecap="round"/>
  <circle cx="88" cy="74" r="5" fill="#FFFFFF"/>
  <circle cx="132" cy="74" r="5" fill="#FFFFFF"/>

  <!-- Capacete de Engenheiro (Amarelo Ouro / Âmbar M3) -->
  <g transform="translate(60, 32)">
    <path d="M0 24 C 0 8 20 0 50 0 C 80 0 100 8 100 24 Z" fill="#F9AB00"/>
    <rect x="-4" y="22" width="108" height="6" rx="3" fill="#F29900"/>
    <circle cx="50" cy="10" r="4" fill="#FFE082"/>
  </g>

  <!-- 3 Pilhas / Camadas Simbólicas Flutuantes à Direita -->
  <g transform="translate(170, 40)">
    <rect x="0" y="0" width="45" height="12" rx="6" fill="#3DDC84" fill-opacity="0.9"/>
    <rect x="0" y="16" width="45" height="12" rx="6" fill="#80E89E" fill-opacity="0.8"/>
    <rect x="0" y="32" width="45" height="12" rx="6" fill="#1B5E20" fill-opacity="0.8"/>
    <text x="22" y="9" fill="#121316" font-family="system-ui, sans-serif" font-size="7" font-weight="900" text-anchor="middle">APP</text>
    <text x="22" y="25" fill="#121316" font-family="system-ui, sans-serif" font-size="7" font-weight="900" text-anchor="middle">FRAME</text>
    <text x="22" y="41" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="7" font-weight="900" text-anchor="middle">KERNEL</text>
  </g>
</svg>
