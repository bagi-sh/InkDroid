<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Bugdroid Acadêmico - Favicon Oficial InkDroid -->
  
  <!-- Antenas -->
  <line x1="22" y1="28" x2="14" y2="16" stroke="#3DDC84" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="42" y1="28" x2="50" y2="16" stroke="#3DDC84" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Cabeça Cúpula Bugdroid -->
  <path d="M 12 52 C 12 33 21 24 32 24 C 43 24 52 33 52 52 Z" fill="#3DDC84"/>

  <!-- Óculos Intelectuais / Acadêmicos -->
  <!-- Lente Esquerda -->
  <circle cx="23" cy="40" r="5.5" fill="#FFFFFF" stroke="#111813" stroke-width="2"/>
  <circle cx="23" cy="40" r="2" fill="#111813"/>
  <!-- Lente Direita -->
  <circle cx="41" cy="40" r="5.5" fill="#FFFFFF" stroke="#111813" stroke-width="2"/>
  <circle cx="41" cy="40" r="2" fill="#111813"/>
  <!-- Ponte dos Óculos -->
  <line x1="28.5" y1="40" x2="35.5" y2="40" stroke="#111813" stroke-width="2" stroke-linecap="round"/>

  <!-- Capelo de Formatura Acadêmico -->
  <!-- Base do Chapéu -->
  <rect x="22" y="21" width="20" height="7" rx="2" fill="#111813" stroke="#3DDC84" stroke-width="1"/>
  <!-- Losango Superior do Capelo -->
  <polygon points="32,8 55,16 32,24 9,16" fill="#111813" stroke="#3DDC84" stroke-width="1.8"/>
  
  <!-- Ponto Central e Borla Dourada -->
  <circle cx="32" cy="16" r="2.2" fill="#F9AB00"/>
  <path d="M 32 16 Q 47 19 48 30" stroke="#F9AB00" stroke-width="2" stroke-linecap="round" fill="none"/>
  <circle cx="48" cy="32" r="2.2" fill="#F9AB00"/>
</svg>
