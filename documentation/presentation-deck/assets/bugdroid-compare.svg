<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%" fill="none">
  <!-- Compare Bugdroid - Problema vs Solução / Antes vs Depois -->
  <ellipse cx="120" cy="230" rx="75" ry="8" fill="#121316" fill-opacity="0.3"/>

  <!-- Pernas -->
  <rect x="85" y="175" width="18" height="42" rx="9" fill="#3DDC84"/>
  <rect x="135" y="175" width="18" height="42" rx="9" fill="#3DDC84"/>

  <!-- Corpo -->
  <path d="M70 110 H170 V170 C170 180 162 188 152 188 H88 C78 188 70 180 70 170 Z" fill="#3DDC84"/>

  <!-- Cabeça -->
  <path d="M70 96 C70 68 92 46 120 46 C148 46 170 68 170 96 Z" fill="#3DDC84"/>
  <line x1="95" y1="52" x2="81" y2="28" stroke="#3DDC84" stroke-width="5" stroke-linecap="round"/>
  <line x1="145" y1="52" x2="159" y2="28" stroke="#3DDC84" stroke-width="5" stroke-linecap="round"/>
  <circle cx="96" cy="74" r="5" fill="#FFFFFF"/>
  <circle cx="144" cy="74" r="5" fill="#FFFFFF"/>

  <!-- Braços segurando o tablet centralizado -->
  <rect x="42" y="125" width="16" height="46" rx="8" fill="#3DDC84" transform="rotate(30 42 125)"/>
  <rect x="180" y="132" width="16" height="46" rx="8" fill="#3DDC84" transform="rotate(-30 180 132)"/>

  <!-- O Tablet Multilaser M8 nas mãos -->
  <g transform="translate(62, 105)">
    <!-- Corpo do Tablet -->
    <rect x="0" y="0" width="116" height="78" rx="10" fill="#1A1C1E" stroke="#3DDC84" stroke-width="2.5"/>
    <!-- Borda da tela -->
    <rect x="6" y="6" width="104" height="66" rx="6" fill="#121316"/>
    
    <!-- Lado Esquerdo: "Antes" (Vermelho / Bloatware / Lento) -->
    <path d="M6 6 H58 V72 H6 Z" fill="#2E1C1C" rx="4"/>
    <circle cx="20" cy="22" r="5" fill="#FF5252"/>
    <circle cx="34" cy="22" r="5" fill="#FF7043"/>
    <rect x="15" y="34" width="28" height="3" rx="1.5" fill="#FF5252" opacity="0.8"/>
    <rect x="15" y="42" width="36" height="3" rx="1.5" fill="#FF5252" opacity="0.6"/>
    <rect x="15" y="50" width="20" height="3" rx="1.5" fill="#FF5252" opacity="0.4"/>
    <text x="32" y="66" fill="#FF7043" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" text-anchor="middle">BLOAT</text>

    <!-- Divisória central -->
    <line x1="58" y1="6" x2="58" y2="72" stroke="#3DDC84" stroke-width="2"/>

    <!-- Lado Direito: "Depois" (Verde / E-Ink / Limpo) -->
    <path d="M58 6 H110 V72 H58 Z" fill="#1C2E22" rx="4"/>
    <rect x="68" y="18" width="32" height="4" rx="2" fill="#3DDC84"/>
    <rect x="68" y="27" width="24" height="3" rx="1.5" fill="#E2E6EA" opacity="0.9"/>
    <rect x="68" y="35" width="34" height="3" rx="1.5" fill="#E2E6EA" opacity="0.7"/>
    <rect x="68" y="43" width="28" height="3" rx="1.5" fill="#E2E6EA" opacity="0.5"/>
    <text x="85" y="66" fill="#3DDC84" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" text-anchor="middle">INKDROID</text>
  </g>
</svg>
