<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%" fill="none">
  <!-- Waving Bugdroid - Capa / Hero -->
  <defs>
    <filter id="shadow-waving" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Sombra no chão -->
  <ellipse cx="100" cy="230" rx="60" ry="8" fill="#121316" fill-opacity="0.3"/>

  <!-- Pernas -->
  <rect x="72" y="175" width="18" height="42" rx="9" fill="#3DDC84"/>
  <rect x="110" y="175" width="18" height="42" rx="9" fill="#3DDC84"/>

  <!-- Corpo -->
  <path d="M55 110 H145 V170 C145 180 137 188 127 188 H73 C63 188 55 180 55 170 Z" fill="#3DDC84"/>

  <!-- Braço Esquerdo (Descansando / Apoio) -->
  <rect x="30" y="112" width="16" height="54" rx="8" fill="#3DDC84"/>

  <!-- Braço Direito (Acenando!) -->
  <g transform="rotate(-35 158 115)">
    <rect x="150" y="65" width="16" height="54" rx="8" fill="#3DDC84"/>
    <!-- Linhas de aceno / movimento -->
    <path d="M175 60 C 182 66 182 78 175 84" stroke="#3DDC84" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M183 54 C 193 64 193 84 183 94" stroke="#3DDC84" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7"/>
  </g>

  <!-- Cabeça (Semicírculo) -->
  <path d="M55 96 C55 68 75 46 100 46 C125 46 145 68 145 96 Z" fill="#3DDC84"/>

  <!-- Antenas -->
  <line x1="77" y1="52" x2="63" y2="28" stroke="#3DDC84" stroke-width="5" stroke-linecap="round"/>
  <line x1="123" y1="52" x2="137" y2="28" stroke="#3DDC84" stroke-width="5" stroke-linecap="round"/>

  <!-- Olhos -->
  <circle cx="78" cy="74" r="5" fill="#FFFFFF"/>
  <circle cx="122" cy="74" r="5" fill="#FFFFFF"/>

  <!-- Badge de Saudação / Olá -->
  <g transform="translate(130, 20)">
    <rect x="0" y="0" width="55" height="26" rx="13" fill="#1A1C1E" stroke="#3DDC84" stroke-width="1.5"/>
    <text x="27" y="17" fill="#3DDC84" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Olá! 👋</text>
  </g>
</svg>
