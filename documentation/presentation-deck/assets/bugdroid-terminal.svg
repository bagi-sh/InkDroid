<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%" fill="none">
  <!-- Terminal Hacker Bugdroid - Ecossistema CLI & Ferramentas -->
  <ellipse cx="120" cy="230" rx="75" ry="8" fill="#121316" fill-opacity="0.3"/>

  <!-- Pernas (em postura sentada/debruçada) -->
  <rect x="75" y="180" width="20" height="38" rx="9" fill="#3DDC84"/>
  <rect x="125" y="180" width="20" height="38" rx="9" fill="#3DDC84"/>

  <!-- Corpo -->
  <path d="M65 115 H155 V175 C155 185 147 192 137 192 H83 C73 192 65 185 65 175 Z" fill="#3DDC84"/>

  <!-- Cabeça -->
  <path d="M65 101 C65 73 85 51 110 51 C135 51 155 73 155 101 Z" fill="#3DDC84"/>
  <line x1="87" y1="57" x2="73" y2="33" stroke="#3DDC84" stroke-width="5" stroke-linecap="round"/>
  <line x1="133" y1="57" x2="147" y2="33" stroke="#3DDC84" stroke-width="5" stroke-linecap="round"/>
  <circle cx="88" cy="79" r="5" fill="#FFFFFF"/>
  <circle cx="132" cy="79" r="5" fill="#FFFFFF"/>

  <!-- Braços digitando no laptop/terminal -->
  <rect x="42" y="130" width="16" height="42" rx="8" fill="#3DDC84" transform="rotate(35 42 130)"/>
  <rect x="168" y="138" width="16" height="42" rx="8" fill="#3DDC84" transform="rotate(-35 168 138)"/>

  <!-- Laptop / Terminal de Linha de Comando -->
  <g transform="translate(50, 140)">
    <!-- Base do Laptop -->
    <path d="M5 45 L135 45 L125 56 L15 56 Z" fill="#2B2E32" stroke="#3DDC84" stroke-width="1.5"/>
    <rect x="55" y="52" width="30" height="3" rx="1.5" fill="#3DDC84"/>

    <!-- Tela do Laptop -->
    <rect x="15" y="0" width="110" height="45" rx="5" fill="#121316" stroke="#3DDC84" stroke-width="2"/>
    <!-- Barra superior da janela -->
    <rect x="15" y="0" width="110" height="10" rx="3" fill="#1A1C1E"/>
    <circle cx="22" cy="5" r="2" fill="#FF5F56"/>
    <circle cx="28" cy="5" r="2" fill="#FFBD2E"/>
    <circle cx="34" cy="5" r="2" fill="#27C93F"/>

    <!-- Prompt do terminal -->
    <text x="22" y="22" fill="#3DDC84" font-family="monospace" font-size="8" font-weight="bold">$ ./ink install -y</text>
    <text x="22" y="32" fill="#E2E6EA" font-family="monospace" font-size="7">[OK] Debloat 100%</text>
    <rect x="94" y="25" width="4" height="7" fill="#3DDC84"/>
  </g>
</svg>
